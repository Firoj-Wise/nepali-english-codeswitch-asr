seed: 1234
manifest_base_directory: data
train_manifest: data/splits/synthetic_train.jsonl
dev_manifest: data/splits/real_dev.jsonl
batch_size: 8
learning_rate: 1.0e-5
max_steps: 3000
eval_every_steps: 250
max_grad_norm: 1.0
max_new_tokens: 256
script_gate:
  enabled: false
  aux_loss_weight: 0.1
  inference_bias:
    enabled: false
    strength: 2.0
    confidence_threshold: 0.9
