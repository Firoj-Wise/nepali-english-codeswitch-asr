# Default: DAPO-style objective. See docs/rl_objectives.md for the variants and how to switch.
seed: 1234
manifest_base_directory: data
train_manifest: data/splits/synthetic_train.jsonl
dev_manifest: data/splits/real_dev.jsonl
init_checkpoint: experiments/S1-REPLACE/checkpoints/best.pt
batch_size: 4
group_size: 8
sampling_temperature: 1.0
update_epochs: 2
dynamic_sampling: true
max_empty_fraction: 0.2
learning_rate: 1.0e-6
max_steps: 1500
eval_every_steps: 100
log_samples_every: 100
max_grad_norm: 1.0
max_new_tokens: 256
objective:
  advantage_normalization: group_std
  loss_aggregation: token_mean
  importance_ratio: token
  clip_low: 0.2
  clip_high: 0.28
  kl_coefficient: 0.0
  constant_normalizer: 256
reward:
  lambda_scr: 0.5  # 0.0 for S3
  lambda_hal: 0.0  # 0.0 for S3 to S5; positive for S6
script_gate:
  enabled: false
  inference_bias:
    enabled: false
    strength: 2.0
    confidence_threshold: 0.9
